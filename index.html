<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>財顧合約產生器</title>
<script>
// ===== 密碼設定 =====
var PWD = '771109';
// ====================
(function(){
  var ok = sessionStorage.getItem('cg_auth');
  if(ok === '1') return;
  document.addEventListener('DOMContentLoaded', function(){
    var overlay = document.getElementById('pw-overlay');
    if(overlay) overlay.style.display='flex';
    document.getElementById('app-root').style.display='none';
  });
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei',-apple-system,sans-serif;background:#f0f0f0}

/* 左側表單 */
#sidebar{
  position:fixed;top:0;left:0;width:310px;height:100vh;
  background:#1e2430;overflow-y:auto;padding:14px;
  border-right:2px solid #3b82f6;
  z-index:100;
}
#sidebar h1{font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:12px}

.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:5px 10px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;border:none;background:#2d3748;color:#94a3b8}
.tab.on{background:#1e3a8a;color:#93c5fd}

.g{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b;margin:12px 0 6px}
.row{margin-bottom:8px}
.row label{display:block;font-size:11px;color:#94a3b8;margin-bottom:3px}
.row input,.row select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:5px;color:#e2e8f0;font-size:13px;padding:6px 8px;outline:none}
.row input:focus{border-color:#3b82f6}
.row input.name-input{font-size:17px;font-weight:700;border-color:#3b82f6;background:#0a0f1e;color:#fff}
.half{display:flex;gap:6px}
.half .row{flex:1}
.btns{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid #2d3748}
.btn{flex:1;padding:8px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.btn-print{background:#1e3a8a;color:#93c5fd}
.btn-copy{background:#14532d;color:#4ade80}

/* 右側合約 */
#main{margin-left:310px;padding:20px;min-height:100vh}

#doc{
  background:white;max-width:800px;margin:0 auto;
  padding:50px 60px;
  font-family:'PMingLiU','MingLiU','Microsoft JhengHei',serif;
  font-size:11pt;line-height:1.9;color:#000;
  box-shadow:0 2px 20px rgba(0,0,0,.15);
  min-height:800px;
}

#doc .blank{
  border-bottom:1px solid #000;display:inline-block;
  min-width:80px;vertical-align:bottom;
}
#doc strong.filled{color:#000;font-weight:700}

/* 列印 */
@page{
  size:A4 portrait;
  margin:25mm 28mm;
}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #pw-overlay,#sidebar{display:none!important}
  body{background:white!important;margin:0;padding:0}
  #app-root,#main{display:block!important;margin:0!important;padding:0!important}
  #doc{
    box-shadow:none!important;
    border:none!important;
    margin:0!important;
    padding:0!important;
    max-width:none!important;
    width:100%!important;
    min-height:auto!important;
    font-size:10.5pt!important;
    line-height:1.8!important;
  }
  #doc p{margin-bottom:1px}
  #doc table{width:100%!important}
}
</style>
</head>
<body>

<!-- 密碼遮罩 -->
<div id="pw-overlay" style="display:none;position:fixed;inset:0;background:#0f1117;z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:4px">財顧合約產生器</div>
  <input id="pw-input" type="password" placeholder="請輸入密碼"
    style="background:#1e2430;border:1px solid #3b82f6;border-radius:8px;color:#fff;font-size:18px;padding:12px 20px;outline:none;text-align:center;width:240px"
    onkeydown="if(event.key==='Enter')checkPW()">
  <button onclick="checkPW()"
    style="background:#1e3a8a;color:#93c5fd;border:none;border-radius:8px;padding:10px 32px;font-size:14px;font-weight:700;cursor:pointer">進入</button>
  <div id="pw-err" style="color:#f87171;font-size:12px;display:none">密碼錯誤</div>
</div>

<div id="app-root">
<div id="sidebar">
  <h1>📄 財顧合約產生器</h1>

  <div class="tabs">
    <button class="tab on" onclick="sw(0)">財顧委任</button>
    <button class="tab" onclick="sw(1)">投資確認書</button>
    <button class="tab" onclick="sw(2)">股票代持</button>
  </div>

  <!-- FORM 0 -->
  <div id="f0">
    <div class="row"><label>委託人姓名 *</label><input class="name-input" id="a0" placeholder="王小明" oninput="go()"></div>
    <div class="g">身分資料</div>
    <div class="row"><label>身分證 / 統一編號</label><input id="a1" placeholder="A123456789" oninput="go()"></div>
    <div class="row"><label>地址</label><input id="a2" placeholder="縣市區路號" oninput="go()"></div>
    <div class="row"><label>電話</label><input id="a3" placeholder="0900000000" oninput="go()"></div>
    <div class="g">合約期間</div>
    <div class="row"><label>開始日期</label><input type="date" id="a4" oninput="setEnd();go()"></div>
    <div class="row"><label>結束日期（自動 +1年）</label><input type="date" id="a5" readonly style="opacity:.4"></div>
    <div class="g">報酬</div>
    <div class="half">
      <div class="row"><label>年費（元）</label><input type="number" id="a6" value="15000" oninput="go()"></div>
      <div class="row"><label>付款月份</label><input type="number" id="a7" placeholder="1" min="1" max="12" oninput="go()"></div>
    </div>
    <div class="row"><label>付款截止日</label><input type="number" id="a8" placeholder="31" min="1" max="31" oninput="go()"></div>
    <div class="g">簽約</div>
    <div class="row"><label>簽約日期</label><input type="date" id="a9" oninput="go()"></div>
  </div>

  <!-- FORM 1 -->
  <div id="f1" style="display:none">
    <div class="row"><label>投資人姓名 *</label><input class="name-input" id="b0" placeholder="王小明" oninput="go()"></div>
    <div class="g">資料</div>
    <div class="row"><label>身分證 / 統編</label><input id="b1" placeholder="A123456789" oninput="go()"></div>
    <div class="row"><label>案件編號</label><input id="b2" placeholder="2025-001" oninput="go()"></div>
    <div class="g">投資資訊</div>
    <div class="row"><label>受任人（財務顧問）</label><input id="b3" value="游宗憲" oninput="go()"></div>
    <div class="row"><label>投資標的名稱</label><input id="b4" placeholder="藍新科技股份有限公司" oninput="go()"></div>
    <div class="row"><label>投資金額（元）</label><input type="number" id="b5" placeholder="0" oninput="go()"></div>
    <div class="row"><label>預計執行日期</label><input type="date" id="b6" oninput="go()"></div>
    <div class="g">簽署</div>
    <div class="row"><label>簽署日期</label><input type="date" id="b7" oninput="go()"></div>
  </div>

  <!-- FORM 2 -->
  <div id="f2" style="display:none">
    <div class="row"><label>甲方（投資人）姓名 *</label><input class="name-input" id="c0" placeholder="王小明" oninput="go()"></div>
    <div class="g">甲方資料</div>
    <div class="row"><label>身分證字號</label><input id="c1" placeholder="A123456789" oninput="go()"></div>
    <div class="row"><label>通訊地址</label><input id="c2" placeholder="縣市區路號" oninput="go()"></div>
    <div class="row"><label>出生年月日</label><input type="date" id="c3" oninput="go()"></div>
    <div class="row"><label>電話</label><input id="c4" placeholder="0900000000" oninput="go()"></div>
    <div class="g">股票資訊</div>
    <div class="row"><label>股份有限公司名稱</label><input id="c5" placeholder="藍新科技" oninput="go()"></div>
    <div class="half">
      <div class="row"><label>股數</label><input type="number" id="c6" placeholder="0" oninput="go()"></div>
      <div class="row"><label>每股價格（元）</label><input type="number" id="c7" placeholder="0" oninput="go()"></div>
    </div>
    <div class="row"><label>總價款（自動）</label><input id="c8" readonly style="opacity:.4"></div>
    <div class="g">簽署</div>
    <div class="row"><label>簽署日期</label><input type="date" id="c9" oninput="go()"></div>
  </div>

  <div class="btns">
    <button class="btn btn-print" onclick="window.print()">🖨️ 列印/PDF</button>
    <button class="btn btn-copy" onclick="doCopy()">📋 複製</button>
  </div>
</div>

<div id="main">
  <div id="doc">正在載入合約...</div>
</div>

<script>
var T = 0;

function g(id){ return document.getElementById(id); }
function v(id){ var e=g(id); return e ? e.value.trim() : ''; }

function sw(n){
  T=n;
  [0,1,2].forEach(function(i){
    g('f'+i).style.display = i===n ? 'block' : 'none';
    document.querySelectorAll('.tab')[i].className = 'tab' + (i===n?' on':'');
  });
  go();
}

function setEnd(){
  var s = v('a4');
  if(!s) return;
  var d = new Date(s);
  d.setFullYear(d.getFullYear()+1);
  d.setDate(d.getDate()-1);
  g('a5').value = d.toISOString().split('T')[0];
}

function roc(s){
  if(!s) return null;
  var p = s.split('-');
  return { y: parseInt(p[0])-1911, m: parseInt(p[1]), d: parseInt(p[2]) };
}

function numZh(n){
  n = parseInt(n);
  if(!n || isNaN(n)) return null;
  if(n===0) return '零元整';
  var D=['','一','二','三','四','五','六','七','八','九'];
  var U=['','十','百','千'];
  function seg(x){
    if(!x) return '';
    var s='',z=false;
    for(var i=3;i>=0;i--){
      var d=Math.floor(x/Math.pow(10,i))%10;
      if(d){ if(z)s+='零'; if(!(i===1&&d===1&&!s))s+=D[d]; s+=U[i]; z=false; }
      else if(s) z=true;
    }
    return s;
  }
  var wan=Math.floor(n/10000), ge=n%10000;
  var r='';
  if(wan) r+=seg(wan)+'萬';
  if(ge){ if(wan&&ge<1000)r+='零'; r+=seg(ge); }
  return r+'元整';
}

function B(val, len){
  len = len||6;
  if(val) return '<strong class="filled">'+val+'</strong>';
  var sp='';
  for(var i=0;i<len;i++) sp+='&nbsp;&nbsp;';
  return '<span class="blank">'+sp+'</span>';
}

function fmtDate(s){
  var p=roc(s);
  return p ? p.y+'年'+p.m+'月'+p.d+'日' : null;
}

function go(){
  try{
    if(T===0) gen0();
    else if(T===1) gen1();
    else gen2();
  }catch(e){
    g('doc').innerHTML='<p style="color:red">錯誤：'+e.message+'</p>';
  }
}

// ========== 財顧委任合約書 ==========
function gen0(){
  var name=v('a0'), id=v('a1'), addr=v('a2'), phone=v('a3');
  var s=v('a4'), e=v('a5');
  var fee=v('a6')||'15000';
  var pm=v('a7'), pd=v('a8');
  var sign=v('a9');
  var sp=roc(s), ep=roc(e), sg=roc(sign);
  var feeCh=numZh(fee)||'一萬五千元整';
  var feeNum=parseInt(fee).toLocaleString('zh-TW');
  var _s = sp ? sp.y+'年'+sp.m+'月'+sp.d+'日' : B('',4);
  var _e = ep ? ep.y+'年'+ep.m+'月'+ep.d+'日' : B('',4);
  var _sy = sg?sg.y:B('',3), _sm=sg?sg.m:B('',2), _sd=sg?sg.d:B('',2);

  g('doc').innerHTML =
'<p style="text-align:center;font-size:16pt;font-weight:bold;letter-spacing:4px;margin-bottom:20px">財顧委任合約書</p>'+
'<p>委託人：'+B(name)+'</p>'+
'<p>受任人：游宗憲</p>'+
'<p style="margin-top:10px">緣委託人委請受任人提供資本市場資訊、分享其經驗，並於合法範圍內就委託人詢問事項提供諮詢意見，雙方合意約定之權利義務如下：</p>'+
'<p style="margin-top:12px"><strong>一、服務性質與法律定位</strong></p>'+
'<p>（一） 本契約服務內容僅屬：</p>'+
'<p style="margin-left:2em">1.一般性資本市場資訊分享　2.公開資料整理與說明　3.財務知識教育　4.個人經驗交流</p>'+
'<p>（二） 本服務不包含：個別投資標的推薦、投資買賣建議、資產配置規劃、投資策略制定、投資顧問業務、代為投資或操作資產。</p>'+
'<p>（三） 雙方確認：本契約非投資顧問契約，受任人非投資顧問業者，亦不構成投資招攬、投資募集或任何形式之投資推介行為。</p>'+
'<p style="margin-top:12px"><strong>二、委託期間：</strong></p>'+
'<p>（一） 自民國(下同)'+_s+'起至'+_e+'止，共計1年。</p>'+
'<p>（二） 委託期滿後，如委託人欲以同一條件續行委任，得由受任人以請款單、通訊軟體或電話通知委託人，委託人交付價金後，合約即為成立，委託人逾期未付款者，受任人得暫停或停止提供服務。</p>'+
'<p style="margin-top:12px"><strong>三、委託報酬：</strong></p>'+
'<p>委託人於委託期間內，應於每年'+B(pm,2)+'月'+B(pd,2)+'日以前，按年給付新台幣(下同)'+feeCh+'（NT$'+feeNum+'），作為受任人之委託報酬。支付方式由受任人指定之帳戶或支付方式為之。</p>'+
'<p style="margin-top:12px"><strong>四、受任人權利義務：</strong></p>'+
'<p>（一） 受任人於委託期間，在合乎法規規定範圍內為委託人提供下列服務：</p>'+
'<p style="margin-left:2em">1.不定期提供投資機會資訊蒐集、整理與揭露。2.不定期提供資本市場投資經驗解析。3.就委託人所詢事項提供諮詢意見。</p>'+
'<p>（二） 受任人為提供前開服務，得複委託由第三人提供。（三） 受任人就委託人提供之資料應善盡保密義務，在未得委託人同意或主動揭露前不得以任何方式使第三人知悉。（四） 委託人如未依本合約書給付報酬，受任人於收齊委託報酬前，得拒絕提供任何服務，但如係因可歸責於受任人之事由導致者不得拒絕。（五） 受任人得隨時終止契約，已履行服務部分之報酬仍應給付。（六） 委託人違反契約義務時，受任人就委託人因契約終止所生任何損害均無須負責。（七） 受任人提供之資訊，可能來自公開資料或第三方來源，受任人不保證其正確性、完整性或即時性。（八） 受任人得以書面、電子郵件、通訊軟體或線上平台提供服務。（九） 受任人得保存服務紀錄、通訊內容及相關資料，作為履約管理及法律證據。（十） 投資機會之提供，受市場條件影響，受任人不保證一定提供特定數量或類型之投資機會。</p>'+
'<p style="margin-top:12px"><strong>五、委託人權利義務：</strong></p>'+
'<p>（一） 委託人就受任人提供之資料，除市場上公開資料以外，應善盡保密義務，在未得受任人同意或主動揭露前不得以任何方式使第三人知悉。（二） 受任人如未依本合約書之約定提供服務，經委託人定相當期間仍未履行，委託人得解除本合約書，並就受任人尚未履行之部分得請求受任人返還已領取之報酬及費用，惟若係因其他可歸責於委託人事由所致者，縱受任人尚未履行，就已領取報酬及預付之費用亦不得請求返還。（三） 委託人於委託期間內得單方隨時終止本合約書，惟若於顯然不利於受任人之時期終止者，就受任人因此所受損害應負損害賠償責任。（四） 委託人不得將受任人提供之資料對外公開、作為投資招攬、商業使用或提供第三人。</p>'+
'<p style="margin-top:12px"><strong>六、投資風險與責任限制</strong></p>'+
'<p>（一） 受任人提供任何資訊、說明或觀點僅供一般參考，不構成投資建議、投資招攬，不保證獲利。（二） 委託人所有投資決定均自行判斷並自負盈虧。（三） 受任人不對投資損益結果、市場價格變動、投資機會成本、第三人行為、間接或衍生損害負責。（四） 除受任人故意或重大過失外，不負損害賠償責任。（五） 受任人依本契約所負之一切損害賠償責任，其金額以委託人於契約終止日前一年內實際支付予受任人之報酬總額為上限。（六） 受任人不負責任何營業損失、機會損失或其他間接損害。</p>'+
'<p style="margin-top:12px"><strong>七、服務履行認定、退費限制及資訊價值確認</strong></p>'+
'<p>（一） 本契約服務之履行，以各項服務內容實際提供、交付或開放使用為認定基準，不以時間經過為標準。（二） 凡受任人已提供、交付或開放使用之服務，均視為履行完成，不得請求退費。（三） 已履行服務包括但不限於：市場分析報告或研究資料交付；LINE@ 或其他通訊社群加入或服務開通；社群資訊提供或更新；個別問題回覆；客製化資料整理或分析。（四） 前項服務因具不可回復性，一經提供即無法回收或撤回。（五） 委託人不得以未閱讀、未使用、未參與或主觀認定無效益為由要求退費。（六） 契約終止時，僅就尚未提供之服務，依附件「服務價值分配表」按比例退費。（七） 服務價值之認定，不以投資是否成立、投資成果或投資報酬為判斷基準。</p>'+
'<p style="margin-top:12px"><strong>八、投資機會資訊揭露與引介聲明</strong></p>'+
'<p>（一） 受任人於服務過程中，可能提供投資機會相關資訊或第三方聯絡方式，該等行為性質為資訊揭露、機會分享及人脈引介。（二） 本服務不構成投資顧問服務、投資結果保證或收益承諾。是否投資及投資條件，均由委託人自行判斷。</p>'+
'<p style="margin-top:12px"><strong>九、第三方投資關係完全獨立</strong></p>'+
'<p>委託人與任何投資標的、專案或第三方所成立之法律關係，均與受任人無涉。受任人不對投資標的真實性、財務狀況、營運結果、履約能力、投資成果，以及任何投資風險與損益負責，均由委託人自行承擔。</p>'+
'<p style="margin-top:12px"><strong>十、契約終止</strong></p>'+

'<p style="margin-top:12px"><strong>五、代持期間及終止</strong></p>'+

'<p style="margin-top:12px"><strong>六、保密條款</strong></p>'+
'<p>雙方對於本協議履行過程中所知悉之資訊負保密義務。除依法令規定、主管機關要求或經對方書面同意外，不得向第三人揭露。違反者應賠償對方因此所受之直接損害。</p>'+
'<p style="margin-top:12px"><strong>七、準據法及管轄</strong></p>'+
'<p>（一） 本協議之解釋及適用，以中華民國法律為準據法。（二） 因本協議所生或與本協議相關之一切爭議，雙方同意以臺灣高雄地方法院為第一審專屬管轄法院。</p>'+
'<p style="margin-top:12px"><strong>八、其他事項</strong></p>'+

function doCopy(){
  var text=g('doc').innerText;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ alert('已複製！'); }).catch(function(){
      prompt('請手動複製：',text);
    });
  } else {
    prompt('請手動複製：',text);
  }
}

(function init(){
  var today=new Date().toISOString().split('T')[0];
  ['a9','b7','c9'].forEach(function(id){ var e=g(id); if(e)e.value=today; });
  g('a4').value=today;
  setEnd();
  go();
})();
function checkPW(){
  var input = document.getElementById('pw-input').value;
  if(input === PWD){
    sessionStorage.setItem('cg_auth','1');
    document.getElementById('pw-overlay').style.display='none';
    document.getElementById('app-root').style.display='block';
    go();
  } else {
    document.getElementById('pw-err').style.display='block';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
}
